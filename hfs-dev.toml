schema_version = 1
standard = "hfs-dev"
pattern = "A"
runtime_mode = "source-fetch"
space_root_mode = "repo-root"
hfs_dir = "."
public_port = 7860
canonical_health_endpoint = "/_ops/healthz"
release_pin_required = true
release_pin_surfaces = [
  "DEERFLOW_REF=<deer-flow upstream commit SHA>",
]
dev_mutable_sources_allowed = [
  "DEERFLOW_REF=main",
]
required_files = [
  "README.md",
  "Dockerfile",
  "hfs-dev.toml",
  "hfs",
  "docs",
  "scripts",
  "AGENTS.md",
]
